# Publish the package to PyPI when a version tag is pushed.
#
# This workflow is deliberately inert today: it triggers only on a push of a tag
# matching `v*`, and no tag exists. It has no `workflow_dispatch` trigger and no
# `release` trigger, so a branch push, a pull request, a manual dispatch or a
# GitHub release cannot fire it.
#
# The tagged commit is gated before anything is published: `test` runs the same
# checks CI runs, `build` produces and verifies the distributions, and only then
# does `deploy` publish them.
#
# Required manual setup before the first tag is pushed:
#
#   1. Register the project on PyPI as a pending publisher (or create it) for the
#      name `scietex.hal.voltage_amplifier`.
#   2. Add a trusted publisher on PyPI with:
#        - owner:       bond-anton
#        - repository:  scietex.hal.voltage_amplifier
#        - workflow:    release.yml
#        - environment: pypi
#   3. Create the `pypi` environment on GitHub (Settings -> Environments).
#
# Until all three are done, a `v*` tag push fails at the `deploy` job's publish
# step. No API token or password is configured anywhere: publishing uses OIDC
# trusted publishing only.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,lint]"
      - name: Check formatting with ruff
        run: ruff format --check src tests
      - name: Lint with ruff
        run: ruff check src tests
      - name: Type check with ty
        run: ty check src
      - name: Test with pytest
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mandatory for PyPI trusted publishing.
      id-token: write
      # A job-level block replaces the workflow-level one, so restate the read
      # scope instead of silently dropping it.
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
